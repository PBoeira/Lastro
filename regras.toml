# Regras GENÉRICAS do categorizador (vão para o repositório). Não coloque aqui nada pessoal:
# estabelecimentos que você frequenta, empregador, nomes de pessoas. Isso vai no
# regras.local.toml (mesmo formato, fica fora do repositório e vem antes destas regras, menos
# das estruturais: pares entre contas, Pix no crédito, pagamento repetido e compra estornada).
# Depois de editar, rode:
#     .\financas.cmd categorizar --perfil real
#
# Ordem de decisão (a primeira que resolver vence):
#   1. ajustes.local.toml: decisão manual por lançamento (a página de revisão sugere a linha)
#   2. [[regra]], de cima para baixo
#   3. [categoria_api]: categoria da Pluggy, quando vier (só no período de teste)
#   4. [[regra_final]], de cima para baixo (Pix, TED e boletos genéricos)
#   5. "Sem categoria", marcado como duvidoso
#
# Condições de uma regra (todas as informadas precisam casar):
#   descricao      expressão regular sobre descrição, estabelecimento e contraparte,
#                  sem diferenciar maiúsculas nem acentos. Use aspas simples.
#   conta          "BANK" (conta) ou "CREDIT" (cartão)
#   sentido        "entrada" ou "saida"
#   operacao       lista de tipos da API, ex.: ["PIX", "TED", "BOLETO", "PAGAMENTO_FATURA", "ESTORNO"]
#   mesmo_titular  true se a outra ponta tem o seu CPF ou é uma conta sua
#   par_proprio    true se há um lançamento de mesmo valor, em até 2 dias, em outra conta sua
#   contraparte    "CPF" (pessoa) ou "CNPJ" (empresa)
#   pessoa         false para não valer em Pix/TED para pessoas (CPF); use nas regras
#                  de estabelecimento, porque nome de loja pode ser sobrenome
#   instituicao    expressão regular sobre a instituição ('nubank', 'banco do brasil')
#   categoria_api  expressão regular sobre a categoria da Pluggy
#   documento      expressão regular sobre o documento da outra ponta ('CNPJ 00000000000191')
#   parcelado      true para compras parceladas
#   pix_credito_conta   true na saída da conta que acompanha um Pix no crédito
#   pix_credito_cartao  true na cobrança do Pix no crédito no cartão (inclui as parcelas)
#   pagamento_duplicado true no pagamento de fatura que aparece repetido no cartão
#   compra_estornada    true na compra e no estorno do mesmo valor e da mesma loja
#   serie_cancelada     true nas parcelas e nos créditos de um parcelamento cancelado
# Resultado: categoria (precisa existir em [categorias]) e, opcional, duvidoso = true.

[categorias]
# nome = "despesa", "receita" ou "neutro". Neutro não entra em receitas nem despesas.
"Mercado" = "despesa"
"Restaurantes e delivery" = "despesa"
"Transporte" = "despesa"
"Moradia e contas" = "despesa"
"Assinaturas e serviços digitais" = "despesa"
"Saúde" = "despesa"
"Academia e bem-estar" = "despesa"
"Cuidados pessoais" = "despesa"
"Pix no crédito" = "despesa"               # a cobrança no cartão (com a taxa) é o gasto
"Educação" = "despesa"
"Compras" = "despesa"
"Lazer" = "despesa"
"Viagem" = "despesa"
"Tarifas, juros e IOF" = "despesa"
"Impostos" = "despesa"
"Seguros" = "despesa"
"Empréstimos e financiamentos" = "despesa"
"Apostas e loterias" = "despesa"
"Doações e presentes" = "despesa"
"Saque em dinheiro" = "despesa"
"Pix e transferências enviadas" = "despesa"
"Boletos e pagamentos diversos" = "despesa"
"Estornos e cashback" = "despesa"          # valores positivos: reduzem os gastos
"Sem categoria (saída)" = "despesa"
"Salário, bolsa e renda" = "receita"
"Rendimentos" = "receita"
"Pix e transferências recebidas" = "receita"
"Reembolsos" = "receita"
"Sem categoria (entrada)" = "receita"
"Transferência entre contas próprias" = "neutro"     # com par: saiu de uma conta conectada e entrou em outra
"Entrada de conta própria não monitorada" = "neutro" # do seu CPF, vinda de conta que não está conectada
"Saída para conta própria não monitorada" = "neutro" # para o seu CPF, em conta que não está conectada
"Pagamento de fatura" = "neutro"                     # inclui fatura paga em espécie (só aparece no cartão)
"Pix no crédito (repasse pela conta)" = "neutro"     # a saída na conta que acompanha o Pix no crédito
"Pagamento de fatura (duplicado pela API)" = "neutro" # o mesmo pagamento aparece duas vezes no cartão
"Compra estornada" = "neutro"                        # compra e estorno do mesmo valor e da mesma loja
"Poupança (Caixinha e aplicações)" = "neutro"
"Resgate de poupança" = "neutro"

# ---------------------------------------------------------------- neutros
# Caixinhas e aplicações vêm primeiro: são poupança ou resgate, nunca gasto nem receita.

[[regra]]
nome = "Caixinha ou aplicação (saída)"
conta = "BANK"
sentido = "saida"
descricao = 'caixinha|limite garantido|dinheiro guardado|aplicacao|\baplic\b|\brdb\b|\bcdb\b|\blci\b|\blca\b|tesouro|rende facil|poupanca|investimento'
categoria = "Poupança (Caixinha e aplicações)"

[[regra]]
nome = "Resgate de Caixinha ou aplicação"
conta = "BANK"
sentido = "entrada"
descricao = 'caixinha|limite garantido|dinheiro resgatado|resgate|\brdb\b|\bcdb\b|\blci\b|\blca\b|tesouro|rende facil|poupanca'
categoria = "Resgate de poupança"

[[regra]]
nome = "Resgate informado pelo banco"
operacao = ["RESGATE_APLIC_FINANCEIRA"]
categoria = "Resgate de poupança"

[[regra]]
nome = "Transferência entre contas conectadas (par)"
par_proprio = true
categoria = "Transferência entre contas próprias"

[[regra]]
nome = "Entrada do seu CPF sem par (conta não monitorada)"
mesmo_titular = true
sentido = "entrada"
categoria = "Entrada de conta própria não monitorada"

[[regra]]
nome = "Saída para o seu CPF sem par (conta não monitorada)"
mesmo_titular = true
sentido = "saida"
categoria = "Saída para conta própria não monitorada"

# Pagamento repetido: o banco informa o pagamento e a Pluggy monta outro igual a partir da fatura.
[[regra]]
nome = "Pagamento de fatura repetido pela API"
pagamento_duplicado = true
categoria = "Pagamento de fatura (duplicado pela API)"

# Compra anulada: crédito do mesmo valor e da mesma loja depois da compra (devolução, ou compra
# parcelada depois pelo próprio banco). As duas ficam neutras; as parcelas, se houver, contam.
[[regra]]
nome = "Compra anulada por estorno do mesmo valor"
compra_estornada = true
categoria = "Compra estornada"

# Parcelamento cancelado: crédito no mesmo cartão com o valor de uma parcela (ou da compra inteira)
# e o nome da loja ou um texto de estorno. Fica duvidoso: confira na página de revisão.
[[regra]]
nome = "Parcelamento cancelado (detectado automaticamente)"
serie_cancelada = true
categoria = "Compra estornada"
duvidoso = true

# Pix no crédito (Nubank): o gasto é só a cobrança no cartão; a saída na conta é repasse.
[[regra]]
nome = "Pix no crédito: saída na conta"
pix_credito_conta = true
categoria = "Pix no crédito (repasse pela conta)"

[[regra]]
nome = "Pix no crédito: cobrança no cartão"
pix_credito_cartao = true
categoria = "Pix no crédito"

[[regra]]
