# ---------------------------------------------------------------- categoria da Pluggy
# expressão sobre a categoria da Pluggy (em inglês) = categoria nossa.
# Pode ser um texto ou { saida = "...", entrada = "..." }. A ordem importa.

[categoria_api]
'same person' = { entrada = "Entrada de conta própria não monitorada", saida = "Saída para conta própria não monitorada" }
'credit card payment' = "Pagamento de fatura"
'proceeds|dividends' = "Rendimentos"
'automatic investment|fixed income|mutual funds|variable income|pension|investment' = { saida = "Poupança (Caixinha e aplicações)", entrada = "Resgate de poupança" }
'salary|retirement|government aid|entrepreneurial|non-recurring income|^income' = "Salário, bolsa e renda"
'student loan|loans|financing' = "Empréstimos e financiamentos"
'late payment|overdraft|interests charged|bank fees|account fees|wire transfer fees|\batm\b|credit card fees|tax on financial operations' = "Tarifas, juros e IOF"
'income taxes|taxes on investments|urban land|vehicle ownership|traffic tickets|^taxes' = "Impostos"
'groceries' = "Mercado"
'eating out|food delivery|food and drinks' = "Restaurantes e delivery"
'taxi|ride-hailing|public transportation|car rental|bicycle|gas station|parking|tolls|vehicle maintenance|automotive|transportation' = "Transporte"
'gyms|fitness|sports practice|wellness' = "Academia e bem-estar"
'video streaming|music streaming|gaming|digital services' = "Assinaturas e serviços digitais"
'dentist|pharmacy|optometry|hospital|healthcare|health insurance' = "Saúde"
'telecommunications|internet|mobile|\btv\b|rent|houseware|utilities|water|electricity|\bgas\b|housing' = "Moradia e contas"
'online courses|university|school|kindergarten|education|bookstore' = "Educação"
'insurance' = "Seguros"
'lottery|online bet|gambling' = "Apostas e loterias"
'airport|airlines|accommodation|mileage|bus tickets|travel' = "Viagem"
'stadiums|landmarks|cinema|tickets|leisure' = "Lazer"
# 'donations' fica de fora de propósito: a categoria da Pluggy pode marcar como "Donations"
# compras comuns no cartão. Sem esse mapeamento elas aparecem na página de revisão.
'cashback' = "Estornos e cashback"
'online shopping|electronics|pet supplies|clothing|kids|sports goods|office supplies|shopping' = "Compras"

